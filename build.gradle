plugins { id 'base' }

allprojects {
    group = mod_group_id
    version = mod_version
}

tasks.register('collectJars', Sync) {
    group = 'build'
    description = 'Builds selected targets and collects installable jars in build/releases.'
    into layout.buildDirectory.dir('releases')
}

subprojects {
    apply plugin: 'java-library'
    repositories { mavenCentral() }
    def minecraftVersion = project.name.substring(0, project.name.lastIndexOf('-'))
    def loader = project.name.substring(project.name.lastIndexOf('-') + 1)
    ext.minecraftVersion = minecraftVersion
    ext.loader = loader
    ext.targetJavaVersion = minecraftVersion == '1.20.1' ? 17 : 21
    base.archivesName = "worldpause-${minecraftVersion}-${loader}"
    java.toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    java.withSourcesJar()
    sourceSets.main.java.srcDirs(
        rootProject.file('common/src/main/java'),
        rootProject.file("versions/${minecraftVersion}/common/src/main/java"),
        rootProject.file("platforms/${loader}/src/main/java")
    )
    sourceSets.main.resources.srcDirs(
        rootProject.file('common/src/main/resources'),
        rootProject.file("versions/${minecraftVersion}/common/src/main/resources"),
        rootProject.file("platforms/${loader}/src/main/resources")
    )
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = project.targetJavaVersion
    }
    tasks.named('processResources', ProcessResources) {
        def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                          mod_license: mod_license, mod_authors: mod_authors,
                          mod_description: mod_description, minecraft_version: minecraftVersion,
                          java_version: targetJavaVersion,
                          loader_range: minecraftVersion == '1.20.1' ? '[47,48)' : '[52,53)',
                          forge_range: minecraftVersion == '1.20.1' ? '[47.1,48)' : '[52,53)']
        inputs.properties(properties)
        filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
            expand(properties)
        }
        if (minecraftVersion == '1.21.1' && loader != 'fabric') {
            filesMatching('projects.mixins.json') {
                filter { line -> line.contains('"refmap"') ? null : line }
            }
        }
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    afterEvaluate {
        def releaseTask = tasks.named(loader == 'fabric' ? 'remapJar' :
            (minecraftVersion == '1.20.1' ? 'reobfJar' : 'jar'))
        rootProject.tasks.named('collectJars', Sync) {
            dependsOn releaseTask
            from(releaseTask)
        }
    }
}
tasks.named('build') { dependsOn subprojects.collect { "${it.path}:build" } }
tasks.named('clean') { dependsOn subprojects.collect { "${it.path}:clean" } }
